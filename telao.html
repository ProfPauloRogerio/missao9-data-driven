<style>
:root{--petrol:#0a252c;--petrol2:#06191e;--orange:#f18a2a;--white:#f7f8f5;--muted:#9fb1b5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--petrol2);color:var(--white);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
main{height:100dvh;display:grid;place-items:center;padding:clamp(18px,3vw,36px) clamp(18px,3vw,30px) 38px;position:relative;background:radial-gradient(circle at 75% 18%,rgba(241,138,42,.08),transparent 28%),linear-gradient(135deg,#06191e,#0a2c34)}
.logo{position:absolute;top:22px;left:30px;font-weight:950;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--orange)}.class{position:absolute;top:22px;right:30px;color:var(--muted);font-weight:800}
.scene{width:min(1250px,94vw);max-height:calc(100dvh - 72px);text-align:center;display:flex;flex-direction:column;justify-content:center}.kicker{color:var(--orange);font-size:15px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(42px,7vw,96px);line-height:.95;margin:12px 0}h2{font-size:clamp(30px,4.2vw,60px);line-height:1.03;margin:8px 0}p{font-size:clamp(16px,1.8vw,26px);color:var(--muted);max-width:900px;margin:14px auto;line-height:1.28}
.big{font-size:clamp(92px,18vw,260px);font-weight:950;line-height:.8;margin:34px 0;color:#fff}.unit{font-size:clamp(22px,3vw,42px);color:var(--muted);font-weight:700}

.cloud{display:flex;flex-wrap:wrap;gap:18px 28px;justify-content:center;align-items:center;margin-top:35px}.cloud span{font-weight:900;line-height:1;color:#eaf1ef}
.note{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#6f888e;font-size:12px}
@media(max-width:800px){.row{grid-template-columns:150px 1fr 52px}}


/* V10.0.2.6 — QR code na tela inicial */
.waiting-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,360px);gap:28px;align-items:center;text-align:left;width:min(1180px,92vw);margin:0 auto}
.waiting-copy h1{margin:10px 0 14px}
.waiting-copy p{margin:12px 0;max-width:760px}
.waiting-copy .subline{font-size:clamp(15px,1.45vw,22px);color:#dbe5e7;font-weight:700}
.qr-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-shadow:0 18px 40px rgba(0,0,0,.16)}
.qr-card img{width:min(100%,260px);height:auto;display:block;background:#fff;padding:12px;border-radius:18px}
.qr-title{color:#fff;font-size:clamp(16px,1.5vw,22px);font-weight:900;text-align:center}
.qr-sub{color:var(--muted);font-size:clamp(13px,1.1vw,16px);line-height:1.3;text-align:center}
.qr-link{color:#ffc36f;font-size:12px;line-height:1.35;text-align:center;word-break:break-all}
@media(max-width:960px){.waiting-hero{grid-template-columns:1fr;justify-items:center;text-align:center}.waiting-copy p,.waiting-copy .subline{margin-left:auto;margin-right:auto}.qr-card{width:min(360px,88vw)}}


/* V6.3 — ranking em cartões verticais + gráfico de setores */
.ranking-scene{
  width:min(1140px,91vw);
  margin:0 auto;
  max-height:calc(100dvh - 120px);
}
.ranking-scene h2{
  font-size:clamp(30px,4.4vw,58px);
  margin-bottom:4px;
}
.ranking-layout{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:18px;
  align-items:stretch;
  width:min(1140px,91vw);
  margin:10px auto 0;
}
.top3-stack{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.top3-card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:12px 16px;
  text-align:left;
  min-height:90px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.top3-pos{
  color:var(--orange);
  font-size:12px;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
}
.top3-theme{
  font-size:clamp(20px,1.9vw,28px);
  font-weight:900;
  margin-top:6px;
  line-height:1.02;
}
.top3-score{
  color:#ffc36f;
  font-size:clamp(22px,2vw,30px);
  font-weight:950;
  margin-top:6px;
}
.pie-panel{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  border-radius:22px;
  padding:14px 16px 8px;
}
.pie-flex{
  display:grid;
  grid-template-columns:minmax(320px, 420px) 1fr;
  gap:10px 18px;
  align-items:center;
}
.pie-graphic{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:280px;
}
.pie-svg{
  width:min(100%, 330px);
  height:auto;
  overflow:visible;
}
.pie-legend{
  display:grid;
  grid-template-columns:1fr;
  gap:6px;
  align-content:start;
}
.legend-item{
  display:grid;
  grid-template-columns:14px 1fr auto;
  gap:10px;
  align-items:center;
  min-width:0;
}
.legend-swatch{
  width:14px;
  height:14px;
  border-radius:50%;
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset;
}
.legend-theme{
  color:#dbe5e7;
  font-size:clamp(11px,.85vw,14px);
  line-height:1.1;
  font-weight:700;
}
.legend-value{
  color:#fff;
  font-size:clamp(11px,.85vw,14px);
  font-weight:900;
}
.pie-caption{
  margin-top:8px;
  text-align:center;
  color:var(--muted);
  font-size:clamp(11px,.85vw,14px);
}
.slice-pct{
  font-size:14px;
  font-weight:900;
  fill:#0a252c;
}
.slice-pct.small{
  font-size:12px;
}
@media(max-width:1100px){
  .ranking-layout{grid-template-columns:1fr;gap:16px}
  .top3-stack{display:grid;grid-template-columns:repeat(3,1fr)}
  .pie-flex{grid-template-columns:1fr}
  .pie-graphic{min-height:auto}
}


/* V6.3.1a — legenda alinhada à esquerda */
.pie-legend{
  justify-items:start;
}
.legend-item{
  width:100%;
}
.legend-theme,
.legend-value{
  text-align:left;
  justify-self:start;
}
.legend-item{
  grid-template-columns:14px minmax(0,1fr) auto;
}


/* V6.4 — DECIDA */
.decide-question{max-width:1080px;margin:0 auto;max-height:calc(100dvh - 110px)}
.decide-question h2{font-size:clamp(28px,3.6vw,50px);margin:6px 0 10px}
.vote-bars{display:grid;gap:10px;width:min(1020px,88vw);margin:14px auto 0;text-align:left}
.vote-row{display:grid;grid-template-columns:1fr 155px;gap:14px;align-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:12px 18px}
.vote-text{font-size:clamp(14px,1.2vw,19px);font-weight:750;line-height:1.22}
.vote-pct{font-size:clamp(24px,2.6vw,40px);font-weight:950;text-align:right;color:#ffc36f}
.vote-row.top-choice{border-color:rgba(241,138,42,.58);background:rgba(241,138,42,.08)}
.vote-row.top-choice .vote-pct{color:#ffc36f}
.choice-tag{display:inline-block;margin-left:8px;color:#ffc36f;font-size:10px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}


/* V6.4.1 — ajustes de altura, cor e encaixe em projeção */
.ranking-scene .pie-panel,
.ranking-scene .top3-card{box-shadow:0 8px 24px rgba(0,0,0,.10)}
.ranking-scene .legend-value{font-variant-numeric:tabular-nums}
.vote-bars + p{
  margin-top:16px;
  font-size:clamp(16px,1.9vw,24px);
  max-width:980px;
  line-height:1.22;
}
@media (max-height: 820px){
  .ranking-scene h2{font-size:clamp(26px,4vw,52px)}
  .top3-card{min-height:82px}
  .pie-graphic{min-height:250px}
  .pie-svg{width:min(100%, 300px)}
  .vote-row{padding:10px 16px}
  .vote-bars{gap:8px;margin-top:10px}
}


/* V6.5 — fechamento pedagógico */
.closing-scene{
  width:min(1080px,90vw);
  margin:0 auto;
  text-align:center;
}
.closing-scene h2{
  font-size:clamp(34px,4.7vw,64px);
  margin:8px 0 14px;
}
.closing-scene p{
  font-size:clamp(18px,2vw,28px);
  max-width:880px;
}
.concept-chain{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:28px auto 8px;
}
.concept-node{
  padding:12px 18px;
  border-radius:16px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.10);
  font-weight:900;
  font-size:clamp(15px,1.55vw,22px);
}
.concept-arrow{
  color:var(--orange);
  font-size:24px;
  font-weight:950;
}
.signal-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin:28px auto 0;
  max-width:900px;
}
.signal-card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:18px;
}
.signal-icon{
  font-size:34px;
  margin-bottom:8px;
}
.signal-card b{
  display:block;
  font-size:clamp(16px,1.5vw,22px);
}
.signal-card span{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}
.dual-grid{
  display:grid;
  grid-template-columns:1fr 70px 1fr;
  align-items:center;
  gap:18px;
  margin:28px auto 0;
  max-width:940px;
}
.dual-card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:24px;
}
.dual-card strong{
  display:block;
  font-size:clamp(22px,2.3vw,34px);
  margin:8px 0;
}
.dual-plus{
  font-size:42px;
  color:var(--orange);
  font-weight:950;
}
.profile-box{
  margin:28px auto 0;
  max-width:880px;
  background:linear-gradient(135deg,rgba(241,138,42,.12),rgba(255,255,255,.04));
  border:1px solid rgba(241,138,42,.30);
  border-radius:24px;
  padding:24px;
}
.profile-box strong{
  color:#ffc36f;
}
.value-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  max-width:1000px;
  margin:26px auto 0;
}
.value-card{
  border-radius:18px;
  padding:18px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
}
.value-card b{font-size:18px}
.value-card span{display:block;color:var(--muted);font-size:13px;margin-top:5px}
.privacy-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  max-width:960px;
  margin:28px auto 0;
}
.privacy-card{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:20px;
}
.privacy-card .num{
  color:var(--orange);
  font-weight:950;
  font-size:12px;
  letter-spacing:.12em;
}
.privacy-card b{
  display:block;
  margin:8px 0;
  font-size:20px;
}
.jobs-wrap{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin:24px auto 0;
  max-width:1000px;
  text-align:left;
}
.jobs-box{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:22px;
  padding:22px;
}
.jobs-box h3{
  color:#ffc36f;
  margin:0 0 12px;
  font-size:20px;
}
.jobs-cloud{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.job-pill{
  padding:8px 11px;
  border-radius:999px;
  background:rgba(255,255,255,.07);
  color:#e6eff0;
  font-size:13px;
  font-weight:800;
}
.final-definition{
  font-size:clamp(34px,5vw,70px);
  line-height:1.04;
  font-weight:950;
  max-width:980px;
  margin:18px auto;
}
.final-definition span{color:#ffc36f}
@media(max-width:800px){
  .signal-grid,.value-grid,.privacy-list,.jobs-wrap{grid-template-columns:1fr 1fr}
  .dual-grid{grid-template-columns:1fr}
  .dual-plus{line-height:1}
}


/* V7.0 — fechamento com área segura para 1366x768 */
.closing-scene{
  width:min(1040px,88vw);
  max-height:calc(100dvh - 92px);
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.closing-scene h2{font-size:clamp(30px,4vw,54px);margin:5px 0 10px;line-height:1.02}

.signal-grid{gap:10px;margin:18px auto 0}
.signal-card{padding:13px}.signal-icon{font-size:28px;margin-bottom:5px}
.signal-card b{font-size:clamp(14px,1.3vw,18px)}.signal-card span{font-size:11px}
.dual-grid{margin:18px auto 0}.dual-card{padding:17px}.dual-card strong{font-size:clamp(19px,2vw,28px)}
.profile-box{margin:18px auto 0;padding:17px}
.value-grid{gap:10px;margin:18px auto 0}.value-card{padding:14px}
.privacy-list{gap:10px;margin:18px auto 0}.privacy-card{padding:15px}.privacy-card b{font-size:18px}
.jobs-wrap{gap:12px;margin:16px auto 0}.jobs-box{padding:16px}.job-pill{padding:6px 9px;font-size:11px}
.final-definition{font-size:clamp(30px,4.5vw,60px);margin:12px auto}
.bridge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:940px;margin:18px auto 0}
.bridge-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px}
.bridge-card b{display:block;color:#ffc36f;font-size:18px;margin-bottom:5px}.bridge-card span{font-size:12px;color:var(--muted)}


/* V8.0 — contexto do DECIDA e desempate */
.decide-context-telao{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(960px,86vw);margin:14px auto}
.decide-context-telao div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:13px 16px;text-align:left}
.decide-context-telao b{display:block;color:#ffc36f;font-size:10px;letter-spacing:.12em;margin-bottom:4px}
.decide-context-telao span{font-size:14px;line-height:1.25;color:#e4ecee}
@media(max-width:720px){.decide-context-telao{grid-template-columns:1fr}}


/* V8.1 — área segura de projeção e proporção */
main{display:flex;align-items:center;justify-content:center;padding:64px 30px 34px}
.scene{width:min(1250px,94vw);height:calc(100dvh - 104px);max-height:none;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.closing-scene{max-height:100%;overflow:hidden}
@media(max-height:780px){
  .closing-scene h2{font-size:clamp(26px,3.5vw,46px)}
  .closing-scene p{font-size:clamp(13px,1.35vw,18px)}
  .signal-grid,.value-grid,.privacy-list,.jobs-wrap,.bridge-grid{margin-top:12px}
  .signal-card,.value-card,.privacy-card,.jobs-box,.bridge-card{padding:11px}
  .concept-chain{margin-top:12px}
  .profile-box{margin-top:12px;padding:13px}
}
.vote-metrics{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.vote-share{font-size:clamp(23px,2.5vw,38px);font-weight:950;color:#ffc36f}
.support-score{font-size:11px;font-weight:900;color:#9fd6c0;text-transform:uppercase;letter-spacing:.05em}
.support-explain{font-size:12px!important;color:#93a9ae!important;margin-top:10px!important}

(function(root,factory){
  const api=factory();
  if(typeof module==='object' && module.exports) module.exports=api;
  root.M9Engine=api;
})(typeof globalThis!=='undefined'?globalThis:this,function(){
  function medianValue(values){
    const a=(values||[]).map(Number).filter(v=>Number.isFinite(v)&&v>0).sort((x,y)=>x-y);
    if(!a.length)return 0;
    const m=Math.floor(a.length/2);
    return a.length%2?a[m]:(a[m-1]+a[m])/2;
  }

  function reactionScoreMap(reactions,posts){
    const themes=[...new Set((posts||[]).flatMap(p=>[p.theme,p.secondary].filter(Boolean)))];
    const score=Object.fromEntries(themes.map(t=>[t,0]));
    (reactions||[]).forEach(r=>{
      const p=(posts||[]).find(x=>x.id===r.post_id);
      if(!p)return;
      if(r.reaction==='heart'){
        score[p.theme]=(score[p.theme]||0)+5;
        if(p.secondary)score[p.secondary]=(score[p.secondary]||0)+2;
      }
      if(r.reaction==='thumb'){
        score[p.theme]=(score[p.theme]||0)+3;
        if(p.secondary)score[p.secondary]=(score[p.secondary]||0)+1;
      }
    });
    return score;
  }

  function attentionScoreMap(attention,posts){
    const themes=[...new Set((posts||[]).flatMap(p=>[p.theme,p.secondary].filter(Boolean)))];
    const out=Object.fromEntries(themes.map(t=>[t,0]));
    const bySession={};
    (attention||[]).forEach(a=>{
      const ms=Math.max(0,Math.min(Number(a.duration_ms)||0,10000));
      if(!ms)return;
      (bySession[a.session_id] ||= []).push({...a,_ms:ms});
    });
    Object.values(bySession).forEach(rows=>{
      const med=medianValue(rows.map(r=>r._ms))||1;
      rows.forEach(r=>{
        const p=(posts||[]).find(x=>x.id===r.post_id);
        if(!p)return;
        const relative=Math.min(2,r._ms/med);
        out[p.theme]=(out[p.theme]||0)+relative;
        if(p.secondary)out[p.secondary]=(out[p.secondary]||0)+relative*.4;
      });
    });
    return out;
  }

  function ranking(reactions,attention,posts){
    const scores=reactionScoreMap(reactions,posts);
    const att=attentionScoreMap(attention,posts);
    return Object.entries(scores)
      .map(([theme,score])=>({theme,score,attention:att[theme]||0}))
      .sort((a,b)=>(b.score-a.score)||(b.attention-a.attention)||a.theme.localeCompare(b.theme,'pt-BR'));
  }

  function percent(v,total,decimals=1){
    if(!total)return 0;
    const f=10**decimals;
    return Math.round((Number(v)||0)*100*f/total)/f;
  }

  function supportIndex(rows,choiceCode){
    const values=(rows||[])
      .filter(r=>r.choice_code===choiceCode)
      .flatMap(r=>(Array.isArray(r.evidence_json)?r.evidence_json:[])
        .map(e=>Number(e.strength)).filter(Number.isFinite));
    return values.length?Math.round(values.reduce((a,b)=>a+b,0)/values.length):0;
  }

  function makeRunId(){
    return (globalThis.crypto&&crypto.randomUUID)
      ? crypto.randomUUID()
      : 'run-'+Date.now()+'-'+Math.random().toString(16).slice(2);
  }

  function filterRun(data,group='ALL'){
    const runId=data?.state?.run_id;
    let sessions=(data?.sessions||[]).filter(s=>!runId || !s.run_id || s.run_id===runId);
    if(group!=='ALL')sessions=sessions.filter(s=>s.class_group===group);
    const ids=new Set(sessions.map(s=>s.id));
    const pick=arr=>(arr||[]).filter(x=>ids.has(x.session_id));
    return {
      ...data,
      sessions,
      reactions:pick(data?.reactions),
      attention:pick(data?.attention),
      events:pick(data?.events),
      investigationAnswers:pick(data?.investigationAnswers),
      decisionAnswers:pick(data?.decisionAnswers)
    };
  }


  function stageReadiness(state,metrics,target){
    state=state||{status:'waiting',reveal_stage:0};
    metrics=metrics||{};
    target=Math.max(0,Number(target)||0);

    const total=Number(metrics.total)||0;
    const feedDone=Number(metrics.feedDone)||0;
    const reactions=Number(metrics.reactions)||0;
    const investDone=Number(metrics.investDone)||0;
    const decisionDone=Number(metrics.decisionDone)||0;
    const st=state.status||'waiting';
    const stage=Number(state.reveal_stage)||0;

    const countStatus=(done,hasData=true)=>{
      if(!hasData || done<=0)return 'no';
      if(target>0 && done<target)return 'warn';
      return 'ok';
    };

    const feed = total<=0 ? 'no' : (target>0 && total<target ? 'warn' : 'ok');

    // REVELE só fica disponível depois de FEED_CLOSED.
    const reveal = st!=='feed_closed' && st!=='results_reveal' &&
      !['investigation_preview','investigation_open','decide_preview','decide_open','decide_reveal','closing_reveal'].includes(st)
        ? 'no'
        : countStatus(feedDone,reactions>0);

    // Apresentar INVESTIGUE exige a última cena do REVELE.
    let investigatePreview='no';
    if(st==='results_reveal'){
      investigatePreview = stage>=6 ? 'ok' : 'warn';
    }else if(['investigation_preview','investigation_open','decide_preview','decide_open','decide_reveal','closing_reveal'].includes(st)){
      investigatePreview='ok';
    }

    // Liberar respostas somente após a apresentação da investigação.
    const investigateRelease = st==='investigation_preview' || st==='investigation_open' ? 'ok' : 'no';

    // DECIDA só existe depois de INVESTIGATION_OPEN e conclusão da investigação.
    let decide='no';
    if(['investigation_open','decide_preview','decide_open','decide_reveal','closing_reveal'].includes(st)){
      decide=countStatus(investDone,true);
    }

    // Revelação das decisões somente em DECIDE_OPEN (ou depois) e com decisões concluídas.
    let decisionReveal='no';
    if(['decide_open','decide_reveal','closing_reveal'].includes(st)){
      decisionReveal=countStatus(decisionDone,true);
    }

    // Fechamento somente depois da revelação das decisões.
    let closing='no';
    if(['decide_reveal','closing_reveal'].includes(st)){
      closing=countStatus(decisionDone,true);
    }

    return {feed,reveal,investigatePreview,investigateRelease,decide,decisionReveal,closing};
  }

  function canAction(action,state,readiness,forceCounts=false){
    state=state||{status:'waiting',reveal_stage:0};
    readiness=readiness||{};
    const st=state.status||'waiting';
    const stage=Number(state.reveal_stage)||0;
    const ready=k=>readiness[k]==='ok' || (forceCounts && readiness[k]==='warn');

    switch(action){
      case 'openFeed':
        return (st==='waiting' || st==='feed_paused') && ready('feed');
      case 'pauseFeed':
        return st==='feed_open';
      case 'closeFeed':
        return st==='feed_open' || st==='feed_paused';
      case 'startReveal':
        return st==='feed_closed' && ready('reveal');
      case 'revealPrev':
      case 'revealNext':
        return st==='results_reveal';
      case 'previewInvestigation':
        return st==='results_reveal' && stage>=6 && ready('investigatePreview');
      case 'releaseInvestigation':
        return st==='investigation_preview';
      case 'previewDecide':
        return st==='investigation_open' && ready('decide');
      case 'startDecide':
        return st==='decide_preview';
      case 'revealDecide':
        return st==='decide_open' && ready('decisionReveal');
      case 'startClosing':
        return st==='decide_reveal' && ready('closing');
      case 'closingPrev':
      case 'closingNext':
        return st==='closing_reveal';
      default:
        return false;
    }
  }

  return {medianValue,reactionScoreMap,attentionScoreMap,ranking,percent,supportIndex,makeRunId,filterRun,stageReadiness,canAction};
});

function polar(cx,cy,r,angle){
  const a=(angle-90)*Math.PI/180;
  return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)};
}
function arcPath(cx,cy,r,startAngle,endAngle){
  const start=polar(cx,cy,r,endAngle);
  const end=polar(cx,cy,r,startAngle);
  const largeArc=endAngle-startAngle<=180?0:1;
  return `M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y} Z`;
}
function pieChart(r,total){
  const cx=180, cy=180, radius=132;
  let current=-90;
  const slices=r.map((item,i)=>{
    const pct = total ? (item.score*100/total) : 0;
    const sweep = total ? (item.score/total)*360 : 0;
    const start = current;
    const end = current + sweep;
    current = end;
    const color = PASTELS[i % PASTELS.length];
    const path = arcPath(cx,cy,radius,start,end);
    const mid = start + sweep/2;
    const labelPos = polar(cx,cy,78,mid);
    const pctLabel = pctText(item.score,total);
    const showText = pct >= 6;
    return {
      ...item,
      pct,
      pctLabel,
      color,
      path,
      textX: labelPos.x,
      textY: labelPos.y,
      textClass: pct >= 10 ? 'slice-pct' : 'slice-pct small',
      showText
    };
  });
  const svg = `
    <svg class="pie-svg" viewBox="0 0 360 360" role="img" aria-label="Gráfico de setores do ranking da turma">
      ${slices.map(s=>`<path d="${s.path}" fill="${s.color}" stroke="rgba(6,25,30,.9)" stroke-width="2"></path>`).join('')}
      ${slices.filter(s=>s.showText).map(s=>`<text class="${s.textClass}" x="${s.textX}" y="${s.textY}" text-anchor="middle" dominant-baseline="middle">${s.pctLabel}</text>`).join('')}
    </svg>`;
  const legend = `
    <div class="pie-legend">
      ${slices.map((s,i)=>{
        const lines=shortTheme(s.theme);
        return `<div class="legend-item">
          <span class="legend-swatch" style="background:${s.color}"></span>
          <div class="legend-theme">${i+1}. ${lines.join(' ')}</div>
          <div class="legend-value">${s.pctLabel}</div>
        </div>`;
      }).join('')}
    </div>`;
  return `
    <div class="pie-panel">
      <div class="pie-flex">
        <div class="pie-graphic">${svg}</div>
        ${legend}
      </div>
      <div class="pie-caption">Percentual do total de pontos. Empates são resolvidos pelo índice de atenção relativa.</div>
    </div>`;
}
function metrics(d){

 const views=d.events.filter(e=>e.event_type==='view').length;
 return {participants:d.sessions.length,completed:d.sessions.filter(s=>s.feed_completed_at).length,views,reactions:d.reactions.length,thumbs:d.reactions.filter(r=>r.reaction==='thumb').length,hearts:d.reactions.filter(r=>r.reaction==='heart').length};
}

function sceneHtml(d){

 }
 if(st.status==='decide_reveal'){
   const dec=DECISION[st.winning_theme];
   const rows=d.decisionAnswers||[];
   const counts={};
   (dec?.options||[]).forEach(o=>counts[o.code]=0);
   rows.forEach(x=>counts[x.choice_code]=(counts[x.choice_code]||0)+1);
   const total=Math.max(1,rows.length);
   const topCode=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0]||null;
   const supportIndex=code=>{
     const strengths=rows.filter(r=>r.choice_code===code)
       .flatMap(r=>(Array.isArray(r.evidence_json)?r.evidence_json:[]).map(e=>Number(e.strength)).filter(Number.isFinite));
     return strengths.length?Math.round(strengths.reduce((a,b)=>a+b,0)/strengths.length):0;
   };

     <div class="vote-bars">
       ${(dec?.options||[]).map(opt=>{
         const p=Math.round(100*(counts[opt.code]||0)/total);
         const support=supportIndex(opt.code);
         const top=rows.length && opt.code===topCode;
         return `<div class="vote-row ${top?'top-choice':''}">
           <div class="vote-text">${opt.text}${top?'<span class="choice-tag">(mais votada)</span>':''}</div>

         </div>`;

   </div>`;
 }

async function refresh(){
  try{
    latest=await getAll();
    group=latest.state?.presentation_group||latest.state?.winning_group||'ALL';
    classLabel.textContent=group==='ALL'?'TODAS AS TURMAS':group;
    const d=filtered(latest,group);
    scene.innerHTML=sceneHtml(d);
  }catch(e){
    console.error('Falha no telão:',e);
    scene.innerHTML='<div class="kicker">SINCRONIZAÇÃO</div><h2>Não foi possível atualizar o telão.</h2><p>Verifique se Professor e Telão estão usando a mesma versão e o mesmo modo de conexão.</p>';
  }
}
setInterval(refresh,1200);channel&&(channel.onmessage=refresh);
window.addEventListener('storage',e=>{
  if(!e.key || e.key.startsWith('m9_'))refresh();
});refresh();
